<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 580" font-family="Heebo, Arial, sans-serif">
  <defs>
    <!-- Diagonal stripe patterns -->
    <pattern id="p-gold" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#d8c182"/>
      <line x1="0" y1="6" x2="6" y2="0" stroke="#d7b96a" stroke-width="2"/>
    </pattern>
    <pattern id="p-blue" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#436180"/>
      <line x1="0" y1="6" x2="6" y2="0" stroke="#3a5a7a" stroke-width="2"/>
    </pattern>
    <pattern id="p-gray" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#ececec"/>
      <line x1="0" y1="6" x2="6" y2="0" stroke="#d8d8d8" stroke-width="2"/>
    </pattern>

    <!-- Arrow markers -->
    <marker id="ma-gold-e" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0.5 6,3.5 0,6.5" fill="#ddb240"/>
    </marker>
    <marker id="ma-gold-s" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="6,0.5 0,3.5 6,6.5" fill="#ddb240"/>
    </marker>
    <marker id="ma-blue-e" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0.5 6,3.5 0,6.5" fill="#2f5071"/>
    </marker>
    <marker id="ma-blue-s" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="6,0.5 0,3.5 6,6.5" fill="#2f5071"/>
    </marker>
    <marker id="ma-black-e" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0.5 6,3.5 0,6.5" fill="#000"/>
    </marker>

    <!-- Drop shadow -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feMerge><feMergeNode in="offset"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ===== KUBERNETES CLUSTER ===== -->
  <rect x="10" y="10" width="682" height="556" fill="#f2f2f2" stroke="#000" stroke-width="1.25"/>
  <text x="14" y="559" font-size="16" fill="#000">Kubernetes Cluster</text>

  <!-- ===== DANA NAMESPACE ===== -->
  <rect x="252" y="38" width="440" height="496" fill="none" stroke="#3c966f" stroke-width="1.25"/>
  <text x="472" y="529" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#000">dana namespace</text>

  <!-- ===== OPERATORS (left column) ===== -->

  <!-- capp controller — gold stripes -->
  <rect x="26" y="56" width="190" height="30" fill="#a5a5a5" fill-opacity="0.5"/>
  <rect x="24" y="54" width="190" height="30" fill="url(#p-gold)"/>
  <text x="119" y="74" text-anchor="middle" fill="#fff" font-size="13">capp controller</text>

  <!-- knative controller — blue stripes -->
  <rect x="24" y="108" width="190" height="30" fill="url(#p-blue)"/>
  <text x="119" y="128" text-anchor="middle" fill="#fff" font-size="13">knative controller</text>

  <!-- nfspvc-operator — blue stripes -->
  <rect x="24" y="196" width="190" height="30" fill="url(#p-blue)"/>
  <text x="119" y="216" text-anchor="middle" fill="#fff" font-size="13">nfspvc-operator</text>

  <!-- certificate-operator — blue stripes -->
  <rect x="24" y="240" width="190" height="30" fill="url(#p-blue)"/>
  <text x="119" y="260" text-anchor="middle" fill="#fff" font-size="13">certificate-operator</text>

  <!-- logging-operator — blue stripes -->
  <rect x="24" y="284" width="190" height="30" fill="url(#p-blue)"/>
  <text x="119" y="304" text-anchor="middle" fill="#fff" font-size="13">logging-operator</text>

  <!-- knative eventing — blue stripes -->
  <rect x="24" y="328" width="190" height="30" fill="url(#p-blue)"/>
  <text x="119" y="348" text-anchor="middle" fill="#fff" font-size="13">knative eventing</text>

  <!-- ===== EXAMPLE CRs (right column) ===== -->

  <!-- Capp special group — gold border -->
  <rect x="258" y="46" width="264" height="46" fill="#ddb24014" stroke="#ddb240" stroke-width="1.25"/>
  <rect x="266" y="54" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="74" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">example Capp</text>

  <!-- Blue group: capp-created CRs -->
  <rect x="258" y="100" width="264" height="266" fill="none" stroke="#44709c" stroke-width="1.25"/>

  <!-- example DomainMapping -->
  <rect x="266" y="108" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="128" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">example DomainMapping</text>

  <!-- example ksvc -->
  <rect x="266" y="152" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">example ksvc</text>

  <!-- example NFSPVC -->
  <rect x="266" y="196" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="216" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">example NFSPVC</text>

  <!-- example Certificate -->
  <rect x="266" y="240" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="260" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">example Certificate</text>

  <!-- example Flow/Output -->
  <rect x="266" y="284" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="304" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">example Flow/Output</text>

  <!-- example PingSource/KafkaSource -->
  <rect x="266" y="328" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="348" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">example PingSource/KafkaSource</text>

  <!-- Knative-managed sub-group -->
  <rect x="258" y="380" width="264" height="138" fill="none" stroke="#44709c" stroke-width="1.25"/>

  <!-- autoscaler -->
  <rect x="266" y="388" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="408" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">autoscaler</text>

  <!-- service -->
  <rect x="266" y="428" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="448" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">service</text>

  <!-- pods -->
  <rect x="266" y="468" width="248" height="30" fill="url(#p-gray)"/>
  <text x="390" y="488" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#000">pods</text>

  <!-- ===== CONNECTORS ===== -->

  <!-- capp controller ↔ example Capp [gold dashed, bidirectional] -->
  <line x1="214" y1="69" x2="258" y2="69"
    stroke="#ddb240" stroke-width="1" stroke-dasharray="7,5,0,5"
    marker-start="url(#ma-gold-s)" marker-end="url(#ma-gold-e)"/>
  <rect x="218" y="61" width="48" height="11" fill="#f2f2f2"/>
  <text x="242" y="70" text-anchor="middle" fill="#deb340" font-style="italic" font-size="9">Reconciles</text>

  <!-- knative controller ↔ example DomainMapping [blue dashed, bidirectional] -->
  <line x1="214" y1="123" x2="258" y2="123"
    stroke="#2f5071" stroke-width="1" stroke-dasharray="7,5,0,5"
    marker-start="url(#ma-blue-s)" marker-end="url(#ma-blue-e)"/>
  <rect x="218" y="115" width="48" height="11" fill="#fff"/>
  <text x="242" y="124" text-anchor="middle" fill="#2f5072" font-style="italic" font-size="9">Reconciles</text>

  <!-- knative controller → example ksvc [blue dashed, bent] -->
  <path d="M214,123 L234,123 L234,167 L258,167"
    fill="none" stroke="#2f5071" stroke-width="1" stroke-dasharray="7,5,0,5"
    marker-end="url(#ma-blue-e)"/>

  <!-- nfspvc-operator ↔ example NFSPVC [blue dashed, bidirectional] -->
  <line x1="214" y1="211" x2="258" y2="211"
    stroke="#2f5071" stroke-width="1" stroke-dasharray="7,5,0,5"
    marker-start="url(#ma-blue-s)" marker-end="url(#ma-blue-e)"/>
  <rect x="218" y="203" width="48" height="11" fill="#fff"/>
  <text x="242" y="212" text-anchor="middle" fill="#2f5072" font-style="italic" font-size="9">Reconciles</text>

  <!-- certificate-operator ↔ example Certificate [blue dashed, bidirectional] -->
  <line x1="214" y1="255" x2="258" y2="255"
    stroke="#2f5071" stroke-width="1" stroke-dasharray="7,5,0,5"
    marker-start="url(#ma-blue-s)" marker-end="url(#ma-blue-e)"/>
  <rect x="218" y="247" width="48" height="11" fill="#fff"/>
  <text x="242" y="256" text-anchor="middle" fill="#2f5072" font-style="italic" font-size="9">Reconciles</text>

  <!-- logging-operator ↔ example Flow/Output [blue dashed, bidirectional] -->
  <line x1="214" y1="299" x2="258" y2="299"
    stroke="#2f5071" stroke-width="1" stroke-dasharray="7,5,0,5"
    marker-start="url(#ma-blue-s)" marker-end="url(#ma-blue-e)"/>
  <rect x="218" y="291" width="48" height="11" fill="#fff"/>
  <text x="242" y="300" text-anchor="middle" fill="#2f5072" font-style="italic" font-size="9">Reconciles</text>

  <!-- knative eventing ↔ example PingSource/KafkaSource [blue dashed, bidirectional] -->
  <line x1="214" y1="343" x2="258" y2="343"
    stroke="#2f5071" stroke-width="1" stroke-dasharray="7,5,0,5"
    marker-start="url(#ma-blue-s)" marker-end="url(#ma-blue-e)"/>
  <rect x="218" y="335" width="48" height="11" fill="#fff"/>
  <text x="242" y="344" text-anchor="middle" fill="#2f5072" font-style="italic" font-size="9">Reconciles</text>

  <!-- knative controller → autoscaler group [black solid, Controls] -->
  <!-- Routed along cluster left edge to avoid overlap with horizontal arrows -->
  <path d="M24,123 L11,123 L11,393 L258,393"
    fill="none" stroke="#000" stroke-width="1"
    marker-end="url(#ma-black-e)"/>
  <rect x="7" y="240" width="9" height="40" fill="#f2f2f2"/>
  <text transform="translate(11,264) rotate(-90)" text-anchor="middle" fill="#000" font-size="9">Controls</text>

  <!-- logging-operator → pods [black solid, Collects logs] -->
  <!-- Routed along cluster left edge, slightly inset from Controls path -->
  <path d="M24,299 L18,299 L18,483 L258,483"
    fill="none" stroke="#000" stroke-width="1"
    marker-end="url(#ma-black-e)"/>
  <rect x="14" y="370" width="9" height="56" fill="#f2f2f2"/>
  <text transform="translate(18,400) rotate(-90)" text-anchor="middle" fill="#000" font-size="9">Collects logs</text>
</svg>
